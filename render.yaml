services:
  - type: redis
    name: meetingva-redis
    plan: starter
    ipAllowList: []

  - type: web
    name: meetingva-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: MeetingVA AI API
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-4o-mini
      - key: REDIS_URL
        fromService:
          type: redis
          name: meetingva-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: meetingva-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: meetingva-redis
          property: connectionString

  - type: worker
    name: meetingva-worker
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker:celery_app worker --loglevel=info
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: MeetingVA AI API
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-4o-mini
      - key: REDIS_URL
        fromService:
          type: redis
          name: meetingva-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: meetingva-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: meetingva-redis
          property: connectionString
