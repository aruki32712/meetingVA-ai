services:
  - type: keyvalue
    name: meetingva-redis
    plan: starter
    ipAllowList: []
    maxmemoryPolicy: noeviction
    persistenceMode: journal-snapshot

  - type: web
    name: meetingva-backend
    runtime: python
    rootDir: backend
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: MeetingVA AI API
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-4o-mini
      - key: DIARIZATION_PROVIDER
        value: deepgram
      - key: DIARIZATION_API_KEY
        sync: false
      - key: DIARIZATION_MODEL
        value: nova-3
      - key: DIARIZATION_MODEL_VERSION
        value: latest
      - key: DIARIZATION_MAXIMUM_TURN_GAP_MS
        value: "750"
      - key: DIARIZATION_MINIMUM_CONFIDENCE
        value: "0.5"
      - key: DIARIZATION_MINIMUM_TIMESTAMP_OVERLAP
        value: "0.5"
      - key: WORKER_VERSION
        value: render
      - key: AI_RATE_LIMIT_REQUESTS
        value: 10
      - key: AI_RATE_LIMIT_WINDOW_SECONDS
        value: 60
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meetingva-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: meetingva-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: meetingva-redis
          property: connectionString

  - type: worker
    name: meetingva-worker
    runtime: python
    rootDir: backend
    plan: starter
    maxShutdownDelaySeconds: 300
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.workers.celery_app:celery_app worker --loglevel=info --pool=solo --concurrency=1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: APP_NAME
        value: MeetingVA AI API
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_DATABASE_URL
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_TRANSCRIPTION_MODEL
        value: whisper-1
      - key: OPENAI_ANALYSIS_MODEL
        value: gpt-4o-mini
      - key: DIARIZATION_PROVIDER
        value: deepgram
      - key: DIARIZATION_API_KEY
        sync: false
      - key: DIARIZATION_MODEL
        value: nova-3
      - key: DIARIZATION_MODEL_VERSION
        value: latest
      - key: DIARIZATION_MAXIMUM_TURN_GAP_MS
        value: "750"
      - key: DIARIZATION_MINIMUM_CONFIDENCE
        value: "0.5"
      - key: DIARIZATION_MINIMUM_TIMESTAMP_OVERLAP
        value: "0.5"
      - key: WORKER_VERSION
        value: render
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: meetingva-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: keyvalue
          name: meetingva-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: keyvalue
          name: meetingva-redis
          property: connectionString
