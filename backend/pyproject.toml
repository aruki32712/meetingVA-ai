[project]
name = "meetingva-ai-backend"
version = "0.1.0"
description = "FastAPI service for MeetingVA AI"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.6",
  "uvicorn[standard]==0.34.0",
  "pydantic-settings==2.7.1",
  "python-dotenv==1.0.1",
  "httpx==0.27.2",
  "supabase==2.10.0",
  "celery[redis]==5.4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
